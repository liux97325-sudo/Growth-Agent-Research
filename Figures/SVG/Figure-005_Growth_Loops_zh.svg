<text x="72" y="192" class="head">A · 经营决策</text>
<text x="72" y="230" class="body">可信状态 → 预测 → 候选推理</text>
<text x="72" y="259" class="body">风险 / 信任 / 自审批 → 领域动作</text>
<text x="72" y="288" class="body">保留当时依据与结果引用</text>
<rect x="632" y="150" width="520" height="190" rx="16" fill="white" stroke="#cbd5e1"/>
<rect x="632" y="150" width="6" height="190" rx="3" fill="#0f766e"/>
<text x="656" y="192" class="head">B · 经验蒸馏</text>
<text x="656" y="230" class="body">审计 → 因果记忆 → 观察与反思</text>
<text x="656" y="259" class="body">形成有证据的经验候选</text>
<text x="656" y="288" class="body">成功与失败均进入学习</text>
<rect x="48" y="410" width="520" height="190" rx="16" fill="white" stroke="#cbd5e1"/>
<rect x="48" y="410" width="6" height="190" rx="3" fill="#7c3aed"/>
<text x="72" y="452" class="head">C · 知识演化</text>
<text x="72" y="490" class="body">经验 → 规则 / 策略 / 参数基因</text>
<text x="72" y="519" class="body">版本治理、适用边界与反例</text>
<text x="72" y="548" class="body">可复用知识反哺下一次决策</text>
<rect x="632" y="410" width="520" height="190" rx="16" fill="white" stroke="#cbd5e1"/>
<rect x="632" y="410" width="6" height="190" rx="3" fill="#b45309"/>
<text x="656" y="452" class="head">D · 信任自治</text>
<text x="656" y="490" class="body">持续表现与风险证据 → 信任评估</text>
<text x="656" y="519" class="body">人工升权评审 → 能力授权</text>
<text x="656" y="548" class="body">监控、冻结与降权</text>
<text x="48" y="675" class="foot">设计机制示意，包含待实现部分。知识复用和权限提升都需要验证证据。</text>
