<text x="72" y="192" class="head">01 · Decision context</text>
<text x="72" y="230" class="body">Objectives / trusted state / forecasts</text>
<text x="72" y="259" class="body">Pin evidence and knowledge versions</text>
<rect x="440" y="150" width="320" height="180" rx="16" fill="white" stroke="#cbd5e1"/>
<rect x="440" y="150" width="6" height="180" rx="3" fill="#0f766e"/>
<text x="464" y="192" class="head">02 · Reviewable proposal</text>
<text x="464" y="230" class="body">Hypotheses / actions / NO_ACTION</text>
<text x="464" y="259" class="body">Expected effects / response windows</text>
<rect x="832" y="150" width="320" height="180" rx="16" fill="white" stroke="#cbd5e1"/>
<rect x="832" y="150" width="6" height="180" rx="3" fill="#7c3aed"/>
<text x="856" y="192" class="head">03 · Independent gates</text>
<text x="856" y="230" class="body">Risk → Trust → Self-review</text>
<text x="856" y="259" class="body">Full adapter gates remain incomplete</text>
<rect x="832" y="410" width="320" height="180" rx="16" fill="white" stroke="#cbd5e1"/>
<rect x="832" y="410" width="6" height="180" rx="3" fill="#b45309"/>
<text x="856" y="452" class="head">04 · Receipts &amp; outcomes</text>
<text x="856" y="490" class="body">Action / synthetic NO_ACTION receipts</text>
<text x="856" y="519" class="body">Observe outcomes; preserve provenance</text>
<rect x="440" y="410" width="320" height="180" rx="16" fill="white" stroke="#cbd5e1"/>
<rect x="440" y="410" width="6" height="180" rx="3" fill="#2563eb"/>
<text x="464" y="452" class="head">05 · Reflection &amp; learning</text>
<text x="464" y="490" class="body">Check forecasts and counterexamples</text>
<text x="464" y="519" class="body">Experience candidates with evidence</text>
<rect x="48" y="410" width="320" height="180" rx="16" fill="white" stroke="#cbd5e1"/>
<rect x="48" y="410" width="6" height="180" rx="3" fill="#0f766e"/>
<text x="72" y="452" class="head">06 · Knowledge feedback</text>
<text x="72" y="490" class="body">Promote / observe / downweight</text>
<text x="72" y="519" class="body">Versioned assets inform later decisions</text>
<text x="48" y="675" class="foot">NO_ACTION requires review and observation. Synthetic receipts cause no platform side effects.</text>
<text x="1148" y="700" text-anchor="end" class="foot">GARP · Research design</text>
